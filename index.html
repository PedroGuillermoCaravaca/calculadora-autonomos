<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora Autónomos</title>

  <!-- Vista móvil a pantalla completa -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-main: #000000;
      --bg-screen: #1c1c1e;
      --bg-key-dark: #333333;
      --bg-key-light: #a5a5a5;
      --bg-key-accent: #ff9f0a;
      --text-main: #ffffff;
      --text-muted: #d4d4d4;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui; }

    body {
      margin: 0;
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .calculator {
      width: 100%;
      padding: 16px;
      padding-bottom: 32px;
    }

    .screen {
      background: var(--bg-screen);
      border-radius: 24px;
      padding: 14px 16px;
      margin-bottom: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .screen-main {
      text-align: right;
      font-size: 44px;
      font-weight: 600;
      word-break: break-word;
    }

    .screen-sub {
      text-align: right;
      font-size: 14px;
      color: var(--text-muted);
      white-space: pre-line;
    }

    .section-title {
      font-size: 14px;
      color: var(--text-muted);
      margin: 10px 4px 6px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .input-block { grid-column: span 2; display: flex; flex-direction: column; }
    .input-block.full { grid-column: span 4; }

    label { font-size: 11px; color: var(--text-muted); }

    input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 14px;
      background: #2c2c2e;
      border: none;
      color: var(--text-main);
      text-align: right;
      font-size: 16px;
    }

    .suffix { position: relative; }
    .suffix span {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: #86868b;
    }

    .keypad-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      padding: 16px 0;
      border-radius: 999px;
      border: none;
      font-size: 20px;
      cursor: pointer;
      transition: 0.05s;
      font-weight: 500;
    }

    .btn-dark { background: var(--bg-key-dark); color: #fff; }
    .btn-light { background: var(--bg-key-light); color: #000; }
    .btn-accent { background: var(--bg-key-accent); color: #fff; }
    .btn-wide { grid-column: span 2; }

    .btn:active { transform: scale(0.96); filter: brightness(1.2); }

    .summary { display: none; }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="calculator">

      <div class="screen">
        <div class="screen-main" id="screenMain">0,00 €</div>
        <div class="screen-sub" id="screenSub">Introduce importes e impuestos.</div>
      </div>

      <div class="section-title">Factura</div>
      <div class="inputs">
        <div class="input-block full">
          <label>Base del trabajo</label>
          <div class="suffix">
            <input type="number" id="baseTrabajo" step="0.01" placeholder="0,00">
            <span>€</span>
          </div>
        </div>

        <div class="input-block">
          <label>IVA</label>
          <div class="suffix">
            <input type="number" id="ivaTrabajo" step="0.01" placeholder="21">
            <span>%</span>
          </div>
        </div>

        <div class="input-block">
          <label>IRPF</label>
          <div class="suffix">
            <input type="number" id="irpfTrabajo" step="0.01" placeholder="15">
            <span>%</span>
          </div>
        </div>
      </div>

      <div class="section-title">Gastos</div>
      <div class="inputs">
        <div class="input-block full">
          <label>Base gastos</label>
          <div class="suffix">
            <input type="number" id="baseGastos" step="0.01" placeholder="0,00">
            <span>€</span>
          </div>
        </div>

        <div class="input-block">
          <label>IVA gastos</label>
          <div class="suffix">
            <input type="number" id="ivaGastos" step="0.01" placeholder="21">
            <span>%</span>
          </div>
        </div>
      </div>

      <div class="keypad-row">
        <button class="btn btn-light btn-wide" id="btnLimpiar">BORRAR</button>
        <button class="btn btn-dark" id="btnBruto">BRUTO</button>
        <button class="btn btn-accent" id="btnNeto">NETO</button>
      </div>

    </div>
  </div>

<script>
function num(v){ return isNaN(parseFloat(v)) ? 0 : parseFloat(v); }
function eur(v){ return v.toLocaleString("es-ES",{minimumFractionDigits:2})+" €"; }

function calcular(bruto=false){
  let base = num(baseTrabajo.value);
  let iva = num(ivaTrabajo.value)/100;
  let irpf = num(irpfTrabajo.value)/100;

  let gastosBase = bruto?0:num(baseGastos.value);
  let gastosIVA = bruto?0:(num(ivaGastos.value)/100);

  let ivaFactura = base * iva;
  let irpfFactura = base * irpf;

  let totalCliente = base + ivaFactura - irpfFactura;
  let netoSinGastos = totalCliente;
  let totalGastos = gastosBase + gastosBase*gastosIVA;

  let resultado = bruto ? netoSinGastos : (netoSinGastos - totalGastos);

  screenMain.textContent = eur(resultado);

  screenSub.textContent = 
    "Bruto: " + eur(netoSinGastos) +
    "\nGastos: " + eur(totalGastos) +
    "\nNeto: " + eur(netoSinGastos - totalGastos);
}

btnNeto.onclick = ()=>calcular(false);
btnBruto.onclick = ()=>calcular(true);

btnLimpiar.onclick = ()=>{
  baseTrabajo.value="";
  ivaTrabajo.value="";
  irpfTrabajo.value="";
  baseGastos.value="";
  ivaGastos.value="";
  screenMain.textContent="0,00 €";
  screenSub.textContent="Introduce importes e impuestos.";
};
</script>

</body>
</html>
