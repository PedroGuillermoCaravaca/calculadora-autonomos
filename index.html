<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora Autónomos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-screen: #1c1c1e;
      --text-main: #ffffff;
      --text-muted: #d4d4d4;
      --btn-light: #a5a5a5;
      --btn-dark: #333333;
      --btn-accent: #ff9f0a;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2c2c2e 0%, #000000 60%);
      display: flex;
      justify-content: center;
      padding: 60px 16px 20px;
      color: var(--text-main);
    }

    .calculator {
      width: 100%;
      max-width: 420px;
      background: rgba(0,0,0,0.9);
      border-radius: 32px;
      padding: 24px 16px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Pantalla */
    .screen {
      background: var(--bg-screen);
      border-radius: 24px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .screen-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .screen-main {
      text-align: right;
      font-size: 42px;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
    }
    .screen-sub {
      text-align: right;
      font-size: 13px;
      color: var(--text-muted);
      white-space: pre-line;
    }

    /* Etiquetas */
    .section-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 14px;
    }

    /* Inputs */
    .inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .input-block {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
    }
    .input-block.full {
      grid-column: span 4;
    }

    input[type="number"],
    input[type="text"] {
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: #2c2c2e;
      color: white;
      font-size: 16px;
      text-align: right;
    }

    /* Gastos dinámicos */
    .dynamic-gasto {
      background: #2a2a2d;
      padding: 12px;
      border-radius: 14px;
      margin-top: 10px;
    }
    .dynamic-gasto-title {
      color: var(--btn-accent);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .add-btn {
      width: 100%;
      background: var(--btn-accent);
      color: black;
      padding: 12px 0;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

    /* Botones */
    .keypad-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .btn {
      padding: 16px 0;
      border-radius: 999px;
      border: none;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-light { background: var(--btn-light); color: black; }
    .btn-accent { background: var(--btn-accent); color: black; }

    /* Resumen */
    .summary {
      background: #1c1c1e;
      padding: 14px;
      border-radius: 18px;
      margin-top: 18px;
      font-size: 14px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .strong span:last-child {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="calculator">

    <!-- Pantalla -->
    <div class="screen">
      <div class="screen-title">Beneficio NETO</div>
      <div id="screenMain" class="screen-main">0,00 €</div>
      <div id="screenSub" class="screen-sub">
Introduce los importes para calcular el rendimiento del trabajo.
      </div>
    </div>

    <!-- FACTURA -->
    <div class="section-title">Factura emitida</div>

    <div class="inputs">
      <div class="input-block full">
        <label>Base trabajo (€)</label>
        <input type="text" inputmode="decimal" pattern="[0-9]*" id="baseTrabajo" placeholder="0,00" />
      </div>

      <div class="input-block">
        <label>IVA (%)</label>
        <input type="text" inputmode="decimal" pattern="[0-9]*" id="ivaTrabajo" placeholder="21" />
      </div>

      <div class="input-block">
        <label>IRPF (%)</label>
        <input type="text" inputmode="decimal" pattern="[0-9]*" id="irpfTrabajo" placeholder="15" />
      </div>
    </div>

    <!-- GASTOS -->
    <div class="section-title">Gastos</div>

    <div id="gastosContainer"></div>

    <button class="add-btn" id="addGastoBtn">+ Añadir gasto</button>

    <!-- Botones -->
    <div class="keypad-row">
      <button class="btn btn-light" id="btnLimpiar">BORRAR</button>
      <button class="btn btn-accent" id="btnCalcular">NETO</button>
    </div>

    <!-- Resumen -->
    <div class="summary">
      <div class="summary-row strong"><span>Beneficio BRUTO (sin gastos):</span> <span id="resBruto">0,00 €</span></div>
      <div class="summary-row strong"><span>Beneficio NETO (tras gastos):</span> <span id="resNeto">0,00 €</span></div>
    </div>

  </div>

<script>
function toNumber(v) { return parseFloat(v.replace(",", ".")) || 0; }
function euro(v) { return v.toLocaleString("es-ES",{minimumFractionDigits:2})+" €"; }

let gastoIndex = 0;

// Añadir gasto dinámico
function addGasto() {
  gastoIndex++;

  const div = document.createElement("div");
  div.className = "dynamic-gasto";
  div.innerHTML = `
    <div class="dynamic-gasto-title">Gasto ${gastoIndex}</div>
    <label>Base (€)</label>
    <input type="text" inputmode="decimal" pattern="[0-9]*" class="gasto-base" placeholder="0,00">
    <label>IVA (%)</label>
    <input type="text" inputmode="decimal" pattern="[0-9]*" class="gasto-iva" placeholder="21">
  `;

  gastosContainer.appendChild(div);
}

addGasto();
addGastoBtn.onclick = addGasto;

// Cálculo principal
function calcular() {
  const base = toNumber(baseTrabajo.value);
  const iva = toNumber(ivaTrabajo.value);
  const irpf = toNumber(irpfTrabajo.value);

  const ingresosBrutos = base + base*(iva/100) - base*(irpf/100);

  let gastos = 0;
  document.querySelectorAll(".dynamic-gasto").forEach(g => {
    const b = toNumber(g.querySelector(".gasto-base").value);
    const i = toNumber(g.querySelector(".gasto-iva").value);
    gastos += b + b*(i/100);
  });

  const beneficioBruto = ingresosBrutos;
  const beneficioNeto = ingresosBrutos - gastos;

  screenMain.textContent = euro(beneficioNeto);
  screenSub.textContent = 
      "Beneficio bruto: " + euro(beneficioBruto) +
      "\nGastos totales: " + euro(gastos);

  resBruto.textContent = euro(beneficioBruto);
  resNeto.textContent = euro(beneficioNeto);
}

btnCalcular.onclick = calcular;

// Reset
btnLimpiar.onclick = () => {
  baseTrabajo.value = "";
  ivaTrabajo.value = "";
  irpfTrabajo.value = "";

  gastosContainer.innerHTML = "";
  gastoIndex = 0;
  addGasto();

  screenMain.textContent = "0,00 €";
  screenSub.textContent = "Introduce los importes para calcular el rendimiento del trabajo.";

  resBruto.textContent = "0,00 €";
  resNeto.textContent = "0,00 €";
};
</script>

</body>
</html>
