<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Calculadora Autónomos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- PWA / iconos -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calc Autónomos">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    :root{
      --bg-body-dark: radial-gradient(circle at top,#2c2c2e 0%,#000 60%);
      --bg-calculator-dark: rgba(0,0,0,0.9);
      --bg-screen-dark: #1c1c1e;
      --bg-input-dark: #2c2c2e;
      --bg-summary-dark: #1c1c1e;

      --bg-body-light: radial-gradient(circle at top,#f2f2f7 0%,#d1d1d6 40%,#e5e5ea 100%);
      --bg-calculator-light: #ffffff;
      --bg-screen-light: #f2f2f7;
      --bg-input-light: #e5e5ea;
      --bg-summary-light: #f2f2f7;

      --accent: #ff9f0a;
      --danger: #ff3b30;
      --whatsapp: #25D366;
      --muted-dark: #d4d4d4;
      --muted-light: #555555;
      --btn-light: #a5a5a5;
    }

    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui}
    body{display:flex;justify-content:center;padding:50px 16px;background:var(--bg-body-dark);color:#fff;transition:all .25s}
    body.light{background:var(--bg-body-light);color:#000}

    .calculator{
      width:100%;max-width:420px;background:var(--bg-calculator-dark);border-radius:28px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.25);position:relative;transition:all .25s;
    }
    body.light .calculator{background:var(--bg-calculator-light)}

    .theme-toggle{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:999px;border:none;background:rgba(0,0,0,.15);color:inherit;cursor:pointer}
    body.light .theme-toggle{background:rgba(0,0,0,0.04)}

    .screen{background:var(--bg-screen-dark);border-radius:18px;padding:12px 14px;margin-bottom:12px;transition:all .25s}
    body.light .screen{background:var(--bg-screen-light)}
    .screen-title{font-size:12px;color:var(--muted-dark)}
    body.light .screen-title{color:var(--muted-light)}
    .screen-main{font-size:42px;text-align:right;font-weight:700;margin-top:6px}
    .screen-sub{font-size:13px;text-align:right;color:var(--muted-dark);white-space:pre-line;margin-top:8px}
    body.light .screen-sub{color:var(--muted-light)}

    .section-title{font-size:13px;margin-top:12px;color:var(--muted-dark)}
    body.light .section-title{color:var(--muted-light)}

    label{display:block;font-size:13px;margin-bottom:4px}
    .inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .input-block{grid-column:span 2;display:flex;flex-direction:column}
    .input-block.full{grid-column:span 4}
    input[type=text]{padding:10px;border-radius:10px;border:none;background:var(--bg-input-dark);color:inherit;text-align:right;font-size:16px}
    body.light input[type=text]{background:var(--bg-input-light)}

    .dynamic-gasto{background:var(--bg-input-dark);padding:10px;border-radius:12px;margin-top:10px;opacity:0;transform:translateY(10px);animation:slideIn .18s forwards}
    body.light .dynamic-gasto{background:var(--bg-input-light)}
    @keyframes slideIn{to{opacity:1;transform:none}}

    .dynamic-gasto-title{color:var(--accent);font-weight:700;margin-bottom:6px}
    .delete-btn{width:100%;background:var(--danger);color:#fff;border:none;padding:9px;border-radius:10px;margin-top:8px;cursor:pointer;font-weight:700}

    .add-btn{width:100%;background:var(--accent);color:#000;border:none;padding:12px;border-radius:12px;margin-top:10px;cursor:pointer;font-weight:700}

    .keypad-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .btn{padding:14px;border-radius:999px;border:none;font-weight:800;cursor:pointer}
    .btn-light{background:var(--btn-light);color:#000}
    .btn-accent{background:var(--accent);color:#000}

    .summary{background:var(--bg-summary-dark);padding:12px;border-radius:12px;margin-top:14px}
    body.light .summary{background:var(--bg-summary-light)}
    .summary-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
    .summary-row strong{font-weight:700}

    /* Acordeón estilo apple */
    .accordion{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
    body.light .accordion{border:1px solid rgba(0,0,0,0.06)}
    .accordion-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:transparent}
    .accordion-header h4{margin:0;font-size:14px}
    .chev{transform:rotate(0);transition:transform .18s}
    .chev.open{transform:rotate(180deg)}
    .accordion-body{max-height:0;overflow:hidden;transition:max-height .22s ease;padding:0 12px}
    .accordion-body.open{padding:10px 12px 12px}

    .detail-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06)}
    body.light .detail-row{border-bottom:1px solid rgba(0,0,0,0.06)}
    .detail-left{display:flex;align-items:center;gap:12px}
    .detail-left label{margin:0;font-size:14px}
    .checkbox{width:18px;height:18px;border-radius:4px;border:2px solid rgba(0,0,0,0.2);display:inline-block;position:relative;background:#fff}
    .checkbox input{display:none}
    .checkbox input:checked + .box{background:var(--accent);border:none}
    .box{width:18px;height:18px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,0.12)}
    .value{font-weight:700}

    .whatsapp-btn{width:100%;background:var(--whatsapp);color:#fff;border:none;padding:12px;border-radius:12px;margin-top:10px;cursor:pointer;font-weight:800}
    /* responsive tweaks */
    @media(min-width:720px){
      body{padding:40px}
      .calculator{margin-top:20px}
    }
  </style>
</head>
<body class="dark">
  <div class="calculator">

    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">☀︎</button>

    <!-- Pantalla -->
    <div class="screen">
      <div class="screen-title" id="screenTitle">Base del trabajo</div>
      <div id="screenMain" class="screen-main">0,00 €</div>
      <div id="screenSub" class="screen-sub">Introduce los importes para calcular tu beneficio real.</div>
    </div>

    <!-- Factura -->
    <div class="section-title">Factura emitida</div>
    <div class="inputs">
      <div class="input-block full">
        <label>Base trabajo (€)</label>
        <input id="baseTrabajo" type="text" inputmode="decimal" pattern="[0-9.,]*" placeholder="0,00">
      </div>

      <div class="input-block">
        <label>IVA (%)</label>
        <input id="ivaTrabajo" type="text" inputmode="decimal" pattern="[0-9.,]*" placeholder="21">
      </div>

      <div class="input-block">
        <label>IRPF (%)</label>
        <input id="irpfTrabajo" type="text" inputmode="decimal" pattern="[0-9.,]*" placeholder="15">
      </div>
    </div>

    <!-- Gastos -->
    <div class="section-title">Gastos</div>
    <div id="gastosContainer"></div>
    <button id="addGastoBtn" class="add-btn">+ Añadir gasto</button>

    <!-- Botones -->
    <div class="keypad-row">
      <button id="btnLimpiar" class="btn btn-light">BORRAR</button>
      <button id="btnCalcular" class="btn btn-accent">NETO</button>
    </div>

    <!-- Resumen compacto -->
    <div class="summary">
      <div class="summary-row">
        <div>Beneficio BRUTO (sin gastos):</div>
        <div id="resBruto" class="value">0,00 €</div>
      </div>
      <div class="summary-row">
        <div>Beneficio NETO (tras gastos):</div>
        <div id="resNeto" class="value">0,00 €</div>
      </div>

      <!-- Acordeón "Más detalles" -->
      <div class="accordion" id="accordion">
        <div class="accordion-header" id="accHeader">
          <h4>Más detalles</h4>
          <div id="chev" class="chev">▾</div>
        </div>
        <div class="accordion-body" id="accBody">
          <!-- detalle 1 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkIvaFactura" checked>
              <label for="chkIvaFactura">IVA factura</label>
            </div>
            <div id="resIvaFactura" class="value">0,00 €</div>
          </div>

          <!-- detalle 2 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkIvaGastos" checked>
              <label for="chkIvaGastos">IVA gastos deducible</label>
            </div>
            <div id="resIvaGastos" class="value">0,00 €</div>
          </div>

          <!-- detalle 3 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkIvaHacienda" checked>
              <label for="chkIvaHacienda">IVA a ingresar a Hacienda</label>
            </div>
            <div id="resIvaHacienda" class="value">0,00 €</div>
          </div>

          <!-- detalle 4 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkIrpfFactura" checked>
              <label for="chkIrpfFactura">IRPF retenido en factura</label>
            </div>
            <div id="resIrpfFactura" class="value">0,00 €</div>
          </div>

          <!-- detalle 5 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkIrpfGastos" checked>
              <label for="chkIrpfGastos">IRPF retenido en gastos</label>
            </div>
            <div id="resIrpfGastos" class="value">0,00 €</div>
          </div>

          <!-- detalle 6 -->
          <div class="detail-row">
            <div class="detail-left">
              <input type="checkbox" id="chkTotalHacienda" checked>
              <label for="chkTotalHacienda">Total que va a Hacienda</label>
            </div>
            <div id="resTotalHacienda" class="value">0,00 €</div>
          </div>
        </div>
      </div>

      <button id="btnWhatsapp" class="whatsapp-btn">Enviar resumen por WhatsApp</button>
    </div>

  </div>

<script>
  // Referencias DOM
  const baseTrabajo = document.getElementById("baseTrabajo");
  const ivaTrabajo = document.getElementById("ivaTrabajo");
  const irpfTrabajo = document.getElementById("irpfTrabajo");
  const addGastoBtn = document.getElementById("addGastoBtn");
  const gastosContainer = document.getElementById("gastosContainer");
  const btnCalcular = document.getElementById("btnCalcular");
  const btnLimpiar = document.getElementById("btnLimpiar");
  const btnWhatsapp = document.getElementById("btnWhatsapp");

  const resBruto = document.getElementById("resBruto");
  const resNeto = document.getElementById("resNeto");

  const resIvaFactura = document.getElementById("resIvaFactura");
  const resIvaGastos = document.getElementById("resIvaGastos");
  const resIvaHacienda = document.getElementById("resIvaHacienda");
  const resIrpfFactura = document.getElementById("resIrpfFactura");
  const resIrpfGastos = document.getElementById("resIrpfGastos");
  const resTotalHacienda = document.getElementById("resTotalHacienda");

  const chkIvaFactura = document.getElementById("chkIvaFactura");
  const chkIvaGastos = document.getElementById("chkIvaGastos");
  const chkIvaHacienda = document.getElementById("chkIvaHacienda");
  const chkIrpfFactura = document.getElementById("chkIrpfFactura");
  const chkIrpfGastos = document.getElementById("chkIrpfGastos");
  const chkTotalHacienda = document.getElementById("chkTotalHacienda");

  const themeToggle = document.getElementById("themeToggle");
  const body = document.body;

  // Acordeón
  const accHeader = document.getElementById("accHeader");
  const accBody = document.getElementById("accBody");
  const chev = document.getElementById("chev");
  let accOpen = false;
  accHeader.addEventListener("click", () => {
    accOpen = !accOpen;
    if (accOpen) {
      accBody.classList.add("open");
      chev.classList.add("open");
      // max-height based on scroll height
      accBody.style.maxHeight = accBody.scrollHeight + "px";
    } else {
      accBody.classList.remove("open");
      chev.classList.remove("open");
      accBody.style.maxHeight = "0px";
    }
  });

  // Tema
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    body.classList.add("light");
    themeToggle.textContent = "☾";
  } else {
    body.classList.remove("light");
    themeToggle.textContent = "☀︎";
  }
  themeToggle.addEventListener("click", () => {
    if (body.classList.contains("light")) {
      body.classList.remove("light");
      themeToggle.textContent = "☀︎";
    } else {
      body.classList.add("light");
      themeToggle.textContent = "☾";
    }
  });

  // Validación numérica
  document.addEventListener("input", e => {
    if (e.target.tagName === "INPUT" && e.target.type === "text") {
      e.target.value = e.target.value.replace(/[^0-9.,]/g, "");
    }
  });

  function toNumber(v){ if(!v) return 0; return parseFloat(v.replace(",","."))||0; }
  function euro(n){ return n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }

  // GASTOS
  let gastoIndex = 0;
  function addGasto(){
    gastoIndex++;
    const div = document.createElement("div");
    div.className = "dynamic-gasto";
    div.innerHTML = `
      <div class="dynamic-gasto-title">Gasto ${gastoIndex}</div>
      <label>Base (€)</label>
      <input type="text" inputmode="decimal" class="gasto-base" placeholder="0,00">
      <label>IVA (%)</label>
      <input type="text" inputmode="decimal" class="gasto-iva" placeholder="21">
      <label>IRPF (%)</label>
      <input type="text" inputmode="decimal" class="gasto-irpf" placeholder="15">
      <button class="delete-btn">Eliminar gasto</button>
    `;
    const del = div.querySelector(".delete-btn");
    del.addEventListener("click", () => { div.remove(); calcular(); });
    gastosContainer.appendChild(div);
  }
  addGastoBtn.addEventListener("click", addGasto);

  // Pantalla dinámica
  baseTrabajo.addEventListener("input", () => {
    const v = toNumber(baseTrabajo.value);
    document.getElementById("screenMain").textContent = v ? euro(v) : "0,00 €";
    document.getElementById("screenTitle").textContent = "Base del trabajo";
    document.getElementById("screenSub").textContent = "Introduce el IVA, el IRPF y los gastos si los hay.";
  });

  // Cálculo
  function calcular(){
    const base = toNumber(baseTrabajo.value);
    const iva = toNumber(ivaTrabajo.value);
    const irpf = toNumber(irpfTrabajo.value);

    const ivaFactura = base * (iva/100);
    const irpfFactura = base * (irpf/100);
    const totalFactura = base + ivaFactura - irpfFactura;

    let gastos = 0;
    let ivaGastos = 0;
    let irpfGastos = 0;

    document.querySelectorAll(".dynamic-gasto").forEach(g => {
      const b = toNumber(g.querySelector(".gasto-base").value);
      const i = toNumber(g.querySelector(".gasto-iva").value);
      const r = toNumber(g.querySelector(".gasto-irpf").value);
      const ivaG = b * (i/100);
      const irpfG = b * (r/100);
      gastos += b + ivaG;
      ivaGastos += ivaG;
      irpfGastos += irpfG;
    });

    const ingresosBrutos = totalFactura;
    const beneficioBruto = ingresosBrutos;
    const beneficioNeto = ingresosBrutos - gastos;

    let ivaHacienda = ivaFactura - ivaGastos;
    if (ivaHacienda < 0) ivaHacienda = 0;
    const totalHacienda = ivaHacienda + irpfFactura + irpfGastos;

    // Actualizar pantalla
    resBruto.textContent = euro(beneficioBruto);
    resNeto.textContent = euro(beneficioNeto);

    // Actualizar detalles
    resIvaFactura.textContent = euro(ivaFactura);
    resIvaGastos.textContent = euro(ivaGastos);
    resIvaHacienda.textContent = euro(ivaHacienda);
    resIrpfFactura.textContent = euro(irpfFactura);
    resIrpfGastos.textContent = euro(irpfGastos);
    resTotalHacienda.textContent = euro(totalHacienda);

    // Mantener pantalla grande con NETO si ya hemos calculado NETO
    document.getElementById("screenTitle").textContent = "Beneficio NETO";
    document.getElementById("screenMain").textContent = euro(beneficioNeto);
    document.getElementById("screenSub").textContent = "Beneficio bruto: " + euro(beneficioBruto) + "\\nGastos totales: " + euro(gastos);
  }

  btnCalcular.addEventListener("click", calcular);

  // Limpiar
  btnLimpiar.addEventListener("click", () => {
    baseTrabajo.value = ""; ivaTrabajo.value = ""; irpfTrabajo.value = "";
    gastosContainer.innerHTML = ""; gastoIndex = 0;
    resBruto.textContent = "0,00 €"; resNeto.textContent = "0,00 €";
    resIvaFactura.textContent = "0,00 €"; resIvaGastos.textContent = "0,00 €";
    resIvaHacienda.textContent = "0,00 €"; resIrpfFactura.textContent = "0,00 €";
    resIrpfGastos.textContent = "0,00 €"; resTotalHacienda.textContent = "0,00 €";
    document.getElementById("screenMain").textContent = "0,00 €";
    document.getElementById("screenTitle").textContent = "Base del trabajo";
    document.getElementById("screenSub").textContent = "Introduce los importes para calcular tu beneficio real.";
  });

  // WhatsApp - envía sólo lo seleccionado + los datos básicos siempre
  btnWhatsapp.addEventListener("click", () => {
    // Aseguramos que los últimos cálculos están actualizados
    calcular();

    const base = toNumber(baseTrabajo.value);
    const iva = ivaTrabajo.value || "0";
    const irpf = irpfTrabajo.value || "0";
    const ivaFacturaTxt = resIvaFactura.textContent;
    const ivaGastosTxt = resIvaGastos.textContent;
    const ivaHaciendaTxt = resIvaHacienda.textContent;
    const irpfFacturaTxt = resIrpfFactura.textContent;
    const irpfGastosTxt = resIrpfGastos.textContent;
    const totalHaciendaTxt = resTotalHacienda.textContent;

    // total importe factura = base + ivaFactura - irpfFactura
    const ivaFactura = toNumber(ivaFacturaTxt);
    const irpfFactura = toNumber(irpfFacturaTxt);
    const totalFactura = base + ivaFactura - irpfFactura;

    // Construcción del texto
    let lines = [];
    lines.push("Resumen Factura");
    lines.push("");
    lines.push("Base Trabajo: " + (base ? euro(base) : "0,00 €"));
    lines.push("IVA (%): " + iva);
    lines.push("IRPF (%): " + irpf);
    lines.push("Total Importe Factura: " + euro(totalFactura));
    lines.push("");

    // Añadir solo las líneas seleccionadas
    if (chkIvaFactura.checked) lines.push("IVA Factura (€): " + ivaFacturaTxt);
    if (chkIvaGastos.checked) lines.push("IVA gastos deducible: " + ivaGastosTxt);
    if (chkIvaHacienda.checked) lines.push("IVA a ingresar a Hacienda (€): " + ivaHaciendaTxt);
    if (chkIrpfFactura.checked) lines.push("IRPF Retenido en Factura (€): " + irpfFacturaTxt);
    if (chkIrpfGastos.checked) lines.push("IRPF retenido en gastos: " + irpfGastosTxt);
    if (chkTotalHacienda.checked) lines.push("Total importe a Hacienda (€): " + totalHaciendaTxt);

    const texto = lines.join("\\n");
    const url = "https://wa.me/?text=" + encodeURIComponent(texto);
    window.open(url, "_blank");
  });

  // Inicial: añadir un gasto por defecto (si lo deseas)
  // addGasto();

</script>
</body>
</html>
