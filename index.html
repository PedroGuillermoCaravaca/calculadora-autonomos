<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculadora Autónomos</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="icon-192.png">

<style>
:root{
  --accent: #ff9f0a;
  --danger: #ff3b30;
  --whatsapp: #25D366;
  --bg-dark: #000;
  --bg-light: #f2f2f7;
  --panel-dark: #111;
  --panel-light: #fff;
  --text-dark: #fff;
  --text-light: #000;
  --input-dark: #1c1c1e;
  --input-light: #e5e5ea;
}

/* GLOBAL */
* { box-sizing: border-box; } /* evita overflows */
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
  background:var(--bg-dark);
  color:var(--text-dark);
  padding:30px 14px;
  display:flex;
  justify-content:center;
}
body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

/* PANEL */
.calculator{
  width:100%;
  max-width:420px;
  background:var(--panel-dark);
  border-radius:26px;
  padding:20px;
  position:relative;
}
body.light .calculator{ background:var(--panel-light); }

/* THEME TOGGLE */
.theme-toggle{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,255,255,0.12);
  border:none;
  width:38px;
  height:38px;
  border-radius:999px;
  font-size:20px;
  color:#fff;
  cursor:pointer;
}
body.light .theme-toggle{ color:#000; }

/* SCREEN */
.screen{
  background:#1c1c1e;
  border-radius:22px;
  padding:16px;
  margin-bottom:20px;
}
body.light .screen{ background:#e5e5ea; }
.screen-main{
  font-size:46px;
  font-weight:700;
  text-align:right;
}
.screen-sub{
  font-size:15px;
  text-align:right;
  white-space:pre-line;
  color:#b2b2b2;
}

/* LABELS & INPUTS */
label{ font-size:17px; margin-top:12px; display:block; }
input[type="text"], input[type="tel"], input[type="number"]{
  width:100%;
  padding:10px 12px;
  background:var(--input-dark);
  color:inherit;
  border:none;
  border-radius:12px;
  margin-top:6px;
  font-size:16px; /* restaurado */
  text-align:right;
}
body.light input[type="text"], body.light input[type="tel"], body.light input[type="number"]{
  background:var(--input-light);
}

/* BOTONES */
.btn-row{ display:flex; gap:14px; margin-top:18px; align-items:center; }
.btn{ flex:1; border:none; padding:14px; border-radius:14px; font-size:19px; font-weight:700; cursor:pointer; }
.btn-light{ background:#a5a5a5; color:#000; }
.btn-calc{ background:var(--accent); color:#000; }

/* ADD GASTO */
.add-btn{ width:100%; background:var(--accent); color:#000; border:none; padding:14px; border-radius:14px; margin-top:16px; font-size:18px; font-weight:700; cursor:pointer; }

/* GASTOS DYNAMIC */
.dynamic-gasto{ background:var(--input-dark); padding:14px; border-radius:16px; margin-top:16px; animation:fadeIn .15s ease-out forwards; }
body.light .dynamic-gasto{ background:var(--input-light); }
@keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.gasto-title{ font-weight:700; margin-bottom:10px; font-size:18px; }
.delete-btn{ width:100%; background:var(--danger); color:#fff; border:none; padding:12px; border-radius:14px; margin-top:12px; font-size:17px; font-weight:700; cursor:pointer; }

/* RESUMEN */
.summary{ background:#1c1c1e; border-radius:18px; padding:16px; margin-top:28px; }
body.light .summary{ background:#e5e5ea; }
.summary-row{ display:flex; justify-content:space-between; font-size:18px; padding:6px 0; }

/* ACORDEON */
.accordion-header{ display:flex; justify-content:space-between; align-items:center; font-size:18px; margin-top:12px; cursor:pointer; padding:10px 0; }
.chev{ transition:transform .2s; }
.chev.open{ transform:rotate(180deg); }
.accordion-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.accordion-body.open{ padding-top:8px; }
.detail-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:17px; border-bottom:1px solid rgba(255,255,255,0.06); }
body.light .detail-row{ border-bottom:1px solid rgba(0,0,0,0.08); }

/* WHATSAPP */
.whatsapp-btn{ width:100%; background:var(--whatsapp); color:#fff; padding:16px; border-radius:14px; font-size:20px; font-weight:800; border:none; margin-top:20px; cursor:pointer; }
</style>
</head>
<body class="dark">

<div class="calculator">
  <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">☀︎</button>

  <!-- Pantalla -->
  <div class="screen">
    <div class="screen-main" id="screenMain">0,00 €</div>
    <div class="screen-sub" id="screenSub">Introduce los importes para calcular tu beneficio real.</div>
  </div>

  <!-- Entradas -->
  <label for="baseTrabajo">Base trabajo (€)</label>
  <input id="baseTrabajo" type="text" inputmode="decimal" placeholder="0,00">

  <label for="ivaTrabajo">IVA (%)</label>
  <input id="ivaTrabajo" type="text" inputmode="decimal" placeholder="21">

  <label for="irpfTrabajo">IRPF (%)</label>
  <input id="irpfTrabajo" type="text" inputmode="decimal" placeholder="15">

  <h3 style="margin-top:20px;font-size:20px;">Gastos</h3>
  <div id="gastosContainer"></div>
  <button id="addGastoBtn" class="add-btn">+ Añadir gasto</button>

  <!-- Botones principales -->
  <div class="btn-row" style="align-items:center;">
    <button id="btnLimpiar" class="btn btn-light">BORRAR</button>
    <button id="btnCalcular" class="btn btn-calc">CALCULAR</button>
  </div>

  <!-- Resumen -->
  <div class="summary">
    <div class="summary-row"><span>Beneficio BRUTO:</span><span id="resBruto">0,00 €</span></div>
    <div class="summary-row"><span>Beneficio NETO:</span><span id="resNeto">0,00 €</span></div>

    <!-- Acordeón -->
    <div class="accordion-header" id="accHeader">Más detalles <span id="chev" class="chev">▾</span></div>

    <div id="accBody" class="accordion-body">
      <div class="detail-row">
        <div><input type="checkbox" id="chkIvaFactura" checked> IVA factura</div>
        <div id="resIvaFactura">0,00 €</div>
      </div>

      <div class="detail-row">
        <div><input type="checkbox" id="chkIvaGastos" checked> IVA gastos deducible</div>
        <div id="resIvaGastos">0,00 €</div>
      </div>

      <div class="detail-row">
        <div><input type="checkbox" id="chkIvaHacienda" checked> IVA a ingresar Hacienda</div>
        <div id="resIvaHacienda">0,00 €</div>
      </div>

      <div class="detail-row">
        <div><input type="checkbox" id="chkIrpfFactura" checked> IRPF factura</div>
        <div id="resIrpfFactura">0,00 €</div>
      </div>

      <div class="detail-row">
        <div><input type="checkbox" id="chkIrpfGastos" checked> IRPF gastos</div>
        <div id="resIrpfGastos">0,00 €</div>
      </div>

      <div class="detail-row">
        <div><input type="checkbox" id="chkTotalHacienda" checked> Total que va a Hacienda</div>
        <div id="resTotalHacienda">0,00 €</div>
      </div>
    </div>

    <button id="btnWhatsapp" class="whatsapp-btn">Enviar resumen por WhatsApp</button>
  </div>

</div>

<script>
/* UTILIDADES */
function toNum(v){ if(!v && v!==0) return 0; return parseFloat(String(v).replace(",",".")||0); }
function euro(n){ return Number(n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }

/* ELEMENTOS */
const baseTrabajo = document.getElementById("baseTrabajo");
const ivaTrabajo = document.getElementById("ivaTrabajo");
const irpfTrabajo = document.getElementById("irpfTrabajo");

const gastosContainer = document.getElementById("gastosContainer");
const addGastoBtn = document.getElementById("addGastoBtn");

const btnCalcular = document.getElementById("btnCalcular");
const btnLimpiar = document.getElementById("btnLimpiar");
const btnWhatsapp = document.getElementById("btnWhatsapp");

const resBruto = document.getElementById("resBruto");
const resNeto = document.getElementById("resNeto");

const resIvaFactura = document.getElementById("resIvaFactura");
const resIvaGastos = document.getElementById("resIvaGastos");
const resIvaHacienda = document.getElementById("resIvaHacienda");
const resIrpfFactura = document.getElementById("resIrpfFactura");
const resIrpfGastos = document.getElementById("resIrpfGastos");
const resTotalHacienda = document.getElementById("resTotalHacienda");

const chkIvaFactura = document.getElementById("chkIvaFactura");
const chkIvaGastos = document.getElementById("chkIvaGastos");
const chkIvaHacienda = document.getElementById("chkIvaHacienda");
const chkIrpfFactura = document.getElementById("chkIrpfFactura");
const chkIrpfGastos = document.getElementById("chkIrpfGastos");
const chkTotalHacienda = document.getElementById("chkTotalHacienda");

/* ACORDEÓN */
const accHeader = document.getElementById("accHeader");
const accBody = document.getElementById("accBody");
const chev = document.getElementById("chev");
let opened = false;
accHeader.addEventListener("click", ()=>{
  opened = !opened;
  chev.classList.toggle("open", opened);
  if(opened){
    accBody.classList.add("open");
    accBody.style.maxHeight = accBody.scrollHeight + "px";
  } else {
    accBody.classList.remove("open");
    accBody.style.maxHeight = "0px";
  }
});

/* TEMA */
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click", ()=>{
  document.body.classList.toggle("light");
  themeToggle.textContent = document.body.classList.contains("light") ? "☾" : "☀︎";
});

/* GASTOS: numeración dinámica y renumeración al borrar */
function renumerarGastos(){
  const gastos = Array.from(gastosContainer.querySelectorAll(".dynamic-gasto"));
  gastos.forEach((g, idx) => {
    const title = g.querySelector(".gasto-title");
    if(title) title.textContent = `Gasto ${idx+1}`;
  });
}

function addGasto(){
  // calcular número basado en existentes
  const currentCount = gastosContainer.querySelectorAll(".dynamic-gasto").length;
  const nextNum = currentCount + 1;

  const div = document.createElement("div");
  div.className = "dynamic-gasto";

  div.innerHTML = `
    <div class="gasto-title">Gasto ${nextNum}</div>
    <label>Base (€)</label>
    <input class="g-base" type="text" inputmode="decimal" placeholder="0,00">

    <label>IVA (%)</label>
    <input class="g-iva" type="text" inputmode="decimal" placeholder="21">

    <label>IRPF (%)</label>
    <input class="g-irpf" type="text" inputmode="decimal" placeholder="15">

    <button class="delete-btn">Eliminar gasto</button>
  `;

  const delBtn = div.querySelector(".delete-btn");
  delBtn.addEventListener("click", ()=>{
    div.remove();
    renumerarGastos();
    calcular(); // recalcula tras eliminar
  });

  gastosContainer.appendChild(div);

  // focus en el input base del nuevo gasto
  const baseInput = div.querySelector(".g-base");
  if(baseInput) baseInput.focus();
}

addGastoBtn.addEventListener("click", addGasto);

/* Evitar letras en inputs */
document.addEventListener("input", (e)=>{
  if(e.target && e.target.tagName === "INPUT"){
    // permitimos números, coma y punto y guion negativo si necesario
    e.target.value = String(e.target.value).replace(/[^0-9,.\-]/g, "");
  }
});

/* CALCULAR */
function calcular(){
  const base = toNum(baseTrabajo.value);
  const iva = toNum(ivaTrabajo.value);
  const irpf = toNum(irpfTrabajo.value);

  const ivaFact = base * (iva/100);
  const irpfFact = base * (irpf/100);
  const totalFactura = base + ivaFact - irpfFact;

  let totalGastos = 0;
  let ivaGastoTotal = 0;
  let irpfGastoTotal = 0;

  document.querySelectorAll(".dynamic-gasto").forEach(g=>{
    const b = toNum(g.querySelector(".g-base").value);
    const i = toNum(g.querySelector(".g-iva").value);
    const r = toNum(g.querySelector(".g-irpf").value);

    const ivaG = b * (i/100);
    const irpfG = b * (r/100);

    totalGastos += b + ivaG;
    ivaGastoTotal += ivaG;
    irpfGastoTotal += irpfG;
  });

  const beneficioBruto = totalFactura;
  const beneficioNeto = totalFactura - totalGastos;

  let ivaHacienda = ivaFact - ivaGastoTotal;
  if(ivaHacienda < 0) ivaHacienda = 0;

  const totalHacienda = ivaHacienda + irpfFact + irpfGastoTotal;

  // actualizar UI
  resBruto.textContent = euro(beneficioBruto);
  resNeto.textContent = euro(beneficioNeto);

  resIvaFactura.textContent = euro(ivaFact);
  resIvaGastos.textContent = euro(ivaGastoTotal);
  resIvaHacienda.textContent = euro(ivaHacienda);
  resIrpfFactura.textContent = euro(irpfFact);
  resIrpfGastos.textContent = euro(irpfGastoTotal);
  resTotalHacienda.textContent = euro(totalHacienda);

  document.getElementById("screenMain").textContent = euro(beneficioNeto);
  document.getElementById("screenSub").textContent =
    "Beneficio bruto: " + euro(beneficioBruto) + "\nGastos totales: " + euro(totalGastos);
}

btnCalcular.addEventListener("click", calcular);

/* BORRAR / RESET */
btnLimpiar.addEventListener("click", ()=>{
  baseTrabajo.value = "";
  ivaTrabajo.value = "";
  irpfTrabajo.value = "";
  gastosContainer.innerHTML = "";
  // after clearing, ensure numbering restarts from 0
  renumerarGastos();

  resBruto.textContent = "0,00 €";
  resNeto.textContent = "0,00 €";

  resIvaFactura.textContent = "0,00 €";
  resIvaGastos.textContent = "0,00 €";
  resIvaHacienda.textContent = "0,00 €";
  resIrpfFactura.textContent = "0,00 €";
  resIrpfGastos.textContent = "0,00 €";
  resTotalHacienda.textContent = "0,00 €";

  document.getElementById("screenMain").textContent = "0,00 €";
  document.getElementById("screenSub").textContent = "Introduce los importes para calcular tu beneficio real.";
});

/* WHATSAPP */
btnWhatsapp.addEventListener("click", ()=>{
  calcular();

  const base = toNum(baseTrabajo.value);
  const iva = ivaTrabajo.value || "0";
  const irpf = irpfTrabajo.value || "0";

  const ivaFacturaTxt = resIvaFactura.textContent;
  const ivaGastosTxt = resIvaGastos.textContent;
  const ivaHaciendaTxt = resIvaHacienda.textContent;
  const irpfFacturaTxt = resIrpfFactura.textContent;
  const irpfGastosTxt = resIrpfGastos.textContent;
  const totalHaciendaTxt = resTotalHacienda.textContent;

  const totalFactura = base + toNum(ivaFacturaTxt) - toNum(irpfFacturaTxt);

  let lines = [];
  lines.push("Resumen Factura");
  lines.push("");
  lines.push("Base Trabajo: " + euro(base));
  lines.push("IVA (%): " + iva);
  lines.push("IRPF (%): " + irpf);
  lines.push("Total Importe Factura: " + euro(totalFactura));
  lines.push("");

  if(chkIvaFactura.checked)    lines.push("IVA Factura (€): " + ivaFacturaTxt);
  if(chkIvaGastos.checked)     lines.push("IVA gastos deducible: " + ivaGastosTxt);
  if(chkIvaHacienda.checked)   lines.push("IVA a ingresar a Hacienda (€): " + ivaHaciendaTxt);
  if(chkIrpfFactura.checked)   lines.push("IRPF Retenido en Factura (€): " + irpfFacturaTxt);
  if(chkIrpfGastos.checked)    lines.push("IRPF retenido en gastos: " + irpfGastosTxt);
  if(chkTotalHacienda.checked) lines.push("Total importe a Hacienda (€): " + totalHaciendaTxt);

  const url = "https://wa.me/?text=" + encodeURIComponent(lines.join("\n"));
  window.open(url, "_blank");
});
</script>

</body>
</html>
