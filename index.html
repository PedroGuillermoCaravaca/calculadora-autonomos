<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculadora Autónomos</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="icon-192.png">

<style>
/* ---------------------- */
/* --- ESTILOS GLOBALES --- */
/* ---------------------- */
:root{
  --accent: #ff9f0a;
  --danger: #ff3b30;
  --whatsapp: #25D366;
  --bg-dark: #000;
  --bg-light: #f2f2f7;
  --panel-dark: #111;
  --panel-light: #fff;
  --text-dark: #fff;
  --text-light: #000;
  --input-dark: #1c1c1e;
  --input-light: #e5e5ea;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
  background:var(--bg-dark);
  color:var(--text-dark);
  padding:30px 14px;
  display:flex;
  justify-content:center;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.calculator{
  width:100%;
  max-width:420px;
  background:var(--panel-dark);
  border-radius:26px;
  padding:20px;
}
body.light .calculator{
  background:var(--panel-light);
}

/* Pantalla */
.screen{
  background:#1c1c1e;
  border-radius:22px;
  padding:16px;
  margin-bottom:20px;
}
body.light .screen{
  background:#e5e5ea;
}
.screen-main{
  font-size:46px;
  font-weight:700;
  text-align:right;
}
.screen-sub{
  font-size:15px;
  text-align:right;
  white-space:pre-line;
  color:#b2b2b2;
}

/* Labels e inputs */
label{
  font-size:17px;
  margin-top:12px;
  display:block;
}
input{
  width:100%;
  padding:14px;
  background:var(--input-dark);
  color:inherit;
  border:none;
  border-radius:14px;
  margin-top:6px;
  font-size:18px;
  text-align:right;
}
body.light input{
  background:var(--input-light);
}

/* Botones */
.btn-row{
  display:flex;
  gap:14px;
  margin-top:18px;
}

.btn{
  flex:1;
  border:none;
  padding:14px;
  border-radius:999px;
  font-size:19px;
  font-weight:700;
  cursor:pointer;
}

.btn-light{
  background:#a5a5a5;
  color:#000;
}

.btn-calc{
  background:var(--accent);
  color:#000;
  border-radius:999px;
}

/* Botón añadir gasto */
.add-btn{
  width:100%;
  background:var(--accent);
  color:#000;
  border:none;
  padding:14px;
  border-radius:14px;
  margin-top:16px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

/* Gastos dinámicos */
.dynamic-gasto{
  background:var(--input-dark);
  padding:14px;
  border-radius:16px;
  margin-top:16px;
  animation:fadeIn .15s ease-out forwards;
}
body.light .dynamic-gasto{
  background:var(--input-light);
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.gasto-title{
  font-weight:700;
  margin-bottom:10px;
  font-size:18px;
}

.delete-btn{
  width:100%;
  background:var(--danger);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:14px;
  margin-top:12px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

/* Resumen */
.summary{
  background:#1c1c1e;
  border-radius:18px;
  padding:16px;
  margin-top:28px;
}
body.light .summary{
  background:#e5e5ea;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  padding:6px 0;
}

/* Acordeón */
.accordion-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:18px;
  margin-top:12px;
  cursor:pointer;
  padding:10px 0;
}
.chev{
  transition:transform .2s;
}
.chev.open{
  transform:rotate(180deg);
}

.accordion-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
}
.accordion-body.open{
  padding-top:8px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  font-size:17px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
body.light .detail-row{
  border-bottom:1px solid rgba(0,0,0,0.1);
}

/* WhatsApp */
.whatsapp-btn{
  width:100%;
  background:var(--whatsapp);
  color:#fff;
  padding:16px;
  border-radius:14px;
  font-size:20px;
  font-weight:800;
  border:none;
  margin-top:20px;
  cursor:pointer;
}

/* Tema */
.theme-toggle{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,255,255,0.15);
  border:none;
  width:38px;
  height:38px;
  border-radius:999px;
  font-size:20px;
  color:#fff;
  cursor:pointer;
}
body.light .theme-toggle{
  color:#000;
}
</style>
</head>

<body class="dark">

<div class="calculator">
<button id="themeToggle" class="theme-toggle">☀︎</button>

<!-- Pantalla -->
<div class="screen">
  <div class="screen-main" id="screenMain">0,00 €</div>
  <div class="screen-sub" id="screenSub">
    Introduce los importes para calcular tu beneficio real.
  </div>
</div>

<!-- Entradas -->
<label>Base trabajo (€)</label>
<input id="baseTrabajo" type="text" inputmode="decimal">

<label>IVA (%)</label>
<input id="ivaTrabajo" type="text" inputmode="decimal">

<label>IRPF (%)</label>
<input id="irpfTrabajo" type="text" inputmode="decimal">

<h3 style="margin-top:20px;font-size:20px;">Gastos</h3>

<div id="gastosContainer"></div>
<button id="addGastoBtn" class="add-btn">+ Añadir gasto</button>

<!-- Botones principales -->
<div class="btn-row">
  <button id="btnLimpiar" class="btn btn-light">BORRAR</button>
  <button id="btnCalcular" class="btn btn-calc">CALCULAR</button>
</div>

<!-- Resumen -->
<div class="summary">
  <div class="summary-row"><span>Beneficio BRUTO:</span><span id="resBruto">0,00 €</span></div>
  <div class="summary-row"><span>Beneficio NETO:</span><span id="resNeto">0,00 €</span></div>

  <!-- Acordeón -->
  <div class="accordion-header" id="accHeader">
    Más detalles <span id="chev" class="chev">▾</span>
  </div>

  <div id="accBody" class="accordion-body">

    <div class="detail-row">
      <div><input type="checkbox" id="chkIvaFactura" checked> IVA factura</div>
      <div id="resIvaFactura">0,00 €</div>
    </div>

    <div class="detail-row">
      <div><input type="checkbox" id="chkIvaGastos" checked> IVA gastos deducible</div>
      <div id="resIvaGastos">0,00 €</div>
    </div>

    <div class="detail-row">
      <div><input type="checkbox" id="chkIvaHacienda" checked> IVA a ingresar Hacienda</div>
      <div id="resIvaHacienda">0,00 €</div>
    </div>

    <div class="detail-row">
      <div><input type="checkbox" id="chkIrpfFactura" checked> IRPF factura</div>
      <div id="resIrpfFactura">0,00 €</div>
    </div>

    <div class="detail-row">
      <div><input type="checkbox" id="chkIrpfGastos" checked> IRPF gastos</div>
      <div id="resIrpfGastos">0,00 €</div>
    </div>

    <div class="detail-row">
      <div><input type="checkbox" id="chkTotalHacienda" checked> Total que va a Hacienda</div>
      <div id="resTotalHacienda">0,00 €</div>
    </div>

  </div>

  <button id="btnWhatsapp" class="whatsapp-btn">Enviar resumen por WhatsApp</button>
</div>

</div>

<script>
/* ---------------------- */
/* --- UTILIDADES --- */
/* ---------------------- */
function toNum(v){
  if(!v) return 0;
  return parseFloat(v.replace(",","."));
}
function euro(n){
  return n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}

/* ---------------------- */
/* --- ELEMENTOS --- */
/* ---------------------- */
const baseTrabajo = document.getElementById("baseTrabajo");
const ivaTrabajo = document.getElementById("ivaTrabajo");
const irpfTrabajo = document.getElementById("irpfTrabajo");

const gastosContainer = document.getElementById("gastosContainer");
const addGastoBtn = document.getElementById("addGastoBtn");

const btnCalcular = document.getElementById("btnCalcular");
const btnLimpiar = document.getElementById("btnLimpiar");
const btnWhatsapp = document.getElementById("btnWhatsapp");

const resBruto = document.getElementById("resBruto");
const resNeto = document.getElementById("resNeto");

const resIvaFactura = document.getElementById("resIvaFactura");
const resIvaGastos = document.getElementById("resIvaGastos");
const resIvaHacienda = document.getElementById("resIvaHacienda");
const resIrpfFactura = document.getElementById("resIrpfFactura");
const resIrpfGastos = document.getElementById("resIrpfGastos");
const resTotalHacienda = document.getElementById("resTotalHacienda");

const chkIvaFactura = document.getElementById("chkIvaFactura");
const chkIvaGastos = document.getElementById("chkIvaGastos");
const chkIvaHacienda = document.getElementById("chkIvaHacienda");
const chkIrpfFactura = document.getElementById("chkIrpfFactura");
const chkIrpfGastos = document.getElementById("chkIrpfGastos");
const chkTotalHacienda = document.getElementById("chkTotalHacienda");

/* ---------------------- */
/* --- ACORDEÓN --- */
/* ---------------------- */
const accHeader = document.getElementById("accHeader");
const accBody = document.getElementById("accBody");
const chev = document.getElementById("chev");
let opened = false;

accHeader.addEventListener("click",()=>{
  opened = !opened;
  chev.classList.toggle("open",opened);
  if(opened){
    accBody.classList.add("open");
    accBody.style.maxHeight = accBody.scrollHeight+"px";
  } else {
    accBody.classList.remove("open");
    accBody.style.maxHeight = "0px";
  }
});

/* ---------------------- */
/* --- TEMA --- */
/* ---------------------- */
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click",()=>{
  document.body.classList.toggle("light");
  themeToggle.textContent = document.body.classList.contains("light") ? "☾" : "☀︎";
});

/* ---------------------- */
/* --- GASTOS --- */
/* ---------------------- */
let gastoIndex = 0;
function addGasto(){
  gastoIndex++;
  const div = document.createElement("div");
  div.className = "dynamic-gasto";

  div.innerHTML = `
    <div class="gasto-title">Gasto ${gastoIndex}</div>
    <label>Base (€)</label>
    <input type="text" class="g-base" inputmode="decimal">

    <label>IVA (%)</label>
    <input type="text" class="g-iva" inputmode="decimal">

    <label>IRPF (%)</label>
    <input type="text" class="g-irpf" inputmode="decimal">

    <button class="delete-btn">Eliminar gasto</button>
  `;

  div.querySelector(".delete-btn").onclick = ()=> div.remove();
  gastosContainer.appendChild(div);
}
addGastoBtn.onclick = addGasto;

/* ---------------------- */
/* --- CALCULAR --- */
/* ---------------------- */
function calcular(){
  const base = toNum(baseTrabajo.value);
  const iva = toNum(ivaTrabajo.value);
  const irpf = toNum(irpfTrabajo.value);

  const ivaFact = base * (iva/100);
  const irpfFact = base * (irpf/100);
  const totalFactura = base + ivaFact - irpfFact;

  let totalGastos = 0;
  let ivaGastoTotal = 0;
  let irpfGastoTotal = 0;

  document.querySelectorAll(".dynamic-gasto").forEach(g=>{
    const b = toNum(g.querySelector(".g-base").value);
    const i = toNum(g.querySelector(".g-iva").value);
    const r = toNum(g.querySelector(".g-irpf").value);

    const ivaG = b * (i/100);
    const irpfG = b * (r/100);

    totalGastos += b + ivaG;
    ivaGastoTotal += ivaG;
    irpfGastoTotal += irpfG;
  });

  const beneficioBruto = totalFactura;
  const beneficioNeto = totalFactura - totalGastos;

  let ivaHacienda = ivaFact - ivaGastoTotal;
  if(ivaHacienda < 0) ivaHacienda = 0;

  const totalHacienda = ivaHacienda + irpfFact + irpfGastoTotal;

  resBruto.textContent = euro(beneficioBruto);
  resNeto.textContent  = euro(beneficioNeto);

  resIvaFactura.textContent = euro(ivaFact);
  resIvaGastos.textContent = euro(ivaGastoTotal);
  resIvaHacienda.textContent = euro(ivaHacienda);
  resIrpfFactura.textContent = euro(irpfFact);
  resIrpfGastos.textContent = euro(irpfGastoTotal);
  resTotalHacienda.textContent = euro(totalHacienda);

  document.getElementById("screenMain").textContent = euro(beneficioNeto);
  document.getElementById("screenSub").textContent =
    "Beneficio bruto: "+euro(beneficioBruto)+"\n"+
    "Gastos totales: "+euro(totalGastos);
}

btnCalcular.onclick = calcular;

/* ---------------------- */
/* --- BORRAR --- */
/* ---------------------- */
btnLimpiar.onclick = ()=>{
  baseTrabajo.value = "";
  ivaTrabajo.value = "";
  irpfTrabajo.value = "";
  gastosContainer.innerHTML = "";
  gastoIndex = 0;

  resBruto.textContent = "0,00 €";
  resNeto.textContent = "0,00 €";

  resIvaFactura.textContent = "0,00 €";
  resIvaGastos.textContent = "0,00 €";
  resIvaHacienda.textContent = "0,00 €";
  resIrpfFactura.textContent = "0,00 €";
  resIrpfGastos.textContent = "0,00 €";
  resTotalHacienda.textContent = "0,00 €";

  document.getElementById("screenMain").textContent = "0,00 €";
  document.getElementById("screenSub").textContent =
    "Introduce los importes para calcular tu beneficio real.";
};

/* ---------------------- */
/* --- WHATSAPP --- */
/* ---------------------- */
btnWhatsapp.onclick = ()=>{
  calcular(); // asegurar coherencia

  const base = toNum(baseTrabajo.value);
  const iva = ivaTrabajo.value || "0";
  const irpf = irpfTrabajo.value || "0";

  const tf = base + toNum(resIvaFactura.textContent) - toNum(resIrpfFactura.textContent);

  let lines = [];
  lines.push("Resumen Factura\n");
  lines.push("Base Trabajo: "+euro(base));
  lines.push("IVA (%): "+iva);
  lines.push("IRPF (%): "+irpf);
  lines.push("Total Importe Factura: "+euro(tf));
  lines.push("");

  if(chkIvaFactura.checked)      lines.push("IVA Factura: " + resIvaFactura.textContent);
  if(chkIvaGastos.checked)       lines.push("IVA gastos deducible: " + resIvaGastos.textContent);
  if(chkIvaHacienda.checked)     lines.push("IVA a ingresar Hacienda: " + resIvaHacienda.textContent);
  if(chkIrpfFactura.checked)     lines.push("IRPF factura: " + resIrpfFactura.textContent);
  if(chkIrpfGastos.checked)      lines.push("IRPF gastos: " + resIrpfGastos.textContent);
  if(chkTotalHacienda.checked)   lines.push("Total que va a Hacienda: " + resTotalHacienda.textContent);

  const url = "https://wa.me/?text="+encodeURIComponent(lines.join("\n"));
  window.open(url,"_blank");
};
</script>

</body>
</html>
