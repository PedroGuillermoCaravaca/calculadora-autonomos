<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calculadora Autónomos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-screen: #1c1c1e;
      --text-main: #ffffff;
      --text-muted: #d4d4d4;
      --bg-key-dark: #333333;
      --bg-key-light: #a5a5a5;
      --bg-key-accent: #ff9f0a;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2c2c2e 0%, #000000 60%);
      display: flex;
      justify-content: center;
      padding: 60px 16px 20px;
      color: var(--text-main);
    }

    .calculator {
      width: 100%;
      max-width: 420px;
      background: rgba(0,0,0,0.9);
      border-radius: 32px;
      padding: 24px 16px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .screen {
      background: var(--bg-screen);
      border-radius: 24px;
      padding: 18px 20px;
      margin-bottom: 18px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .screen-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .screen-main {
      text-align: right;
      font-size: 42px;
      font-weight: 600;
      color: white;
    }

    .screen-sub {
      text-align: right;
      font-size: 13px;
      color: var(--text-muted);
      white-space: pre-line;
    }

    .section-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 14px;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-block {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-block.full {
      grid-column: span 4;
    }

    input[type="number"] {
      padding: 8px 10px;
      border-radius: 14px;
      border: none;
      background: #2c2c2e;
      color: white;
      font-size: 16px;
      text-align: right;
    }

    .dynamic-gasto {
      margin: 10px 0 6px 0;
      padding: 10px;
      background: #2a2a2d;
      border-radius: 12px;
    }

    .dynamic-gasto-title {
      font-size: 13px;
      margin-bottom: 4px;
      color: #ff9f0a;
    }

    .add-btn {
      width: 100%;
      background: #ff9f0a;
      color: black;
      padding: 10px 0;
      margin-top: 6px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 16px;
    }

    .keypad-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 16px 0;
      font-size: 20px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .btn-light {
      background: var(--bg-key-light);
      color: black;
    }

    .btn-dark {
      background: var(--bg-key-dark);
    }

    .summary {
      margin-top: 18px;
      padding: 14px 16px;
      background: #1c1c1e;
      border-radius: 18px;
      font-size: 14px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .strong span:last-child {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="calculator">

    <!-- Pantalla -->
    <div class="screen">
      <div>
        <div class="screen-title">Beneficio NETO</div>
        <div id="screenMain" class="screen-main">0,00 €</div>
      </div>
      <div id="screenSub" class="screen-sub">
Completa los campos para calcular tu beneficio real como autónomo.
      </div>
    </div>

    <!-- FACTURA -->
    <div class="section-title">Factura emitida</div>
    <div class="inputs">
      <div class="input-block full">
        <label>Base trabajo (€)</label>
        <input type="number" id="baseTrabajo" placeholder="0,00" />
      </div>

      <div class="input-block">
        <label>IVA (%)</label>
        <input type="number" id="ivaTrabajo" placeholder="21" />
      </div>

      <div class="input-block">
        <label>IRPF (%)</label>
        <input type="number" id="irpfTrabajo" placeholder="15" />
      </div>
    </div>

    <!-- GASTOS -->
    <div class="section-title">Gastos</div>

    <div id="gastosContainer"></div>

    <button class="add-btn" id="addGastoBtn">+ Añadir gasto</button>

    <!-- BOTONES -->
    <div class="keypad-row">
      <button class="btn btn-light" id="btnLimpiar">BORRAR</button>
      <button class="btn btn-dark" id="btnCalcular">NETO</button>
    </div>

    <!-- RESUMEN -->
    <div class="summary">
      <div class="summary-row"><span>Ingresos netos factura:</span> <span id="resIngresos">0,00 €</span></div>
      <div class="summary-row"><span>Total gastos:</span> <span id="resGastosTotales">0,00 €</span></div>
      <div class="summary-row strong"><span>Beneficio NETO:</span> <span id="resBeneficio">0,00 €</span></div>
    </div>

  </div>

<script>
function toNumber(v) { return parseFloat(v.replace(",", ".")) || 0; }
function euro(v) { return v.toLocaleString("es-ES", { minimumFractionDigits: 2 }) + " €"; }

let gastoIndex = 0;

// Añadir gasto dinámico
function addGasto() {
  gastoIndex++;

  const div = document.createElement("div");
  div.className = "dynamic-gasto";
  div.dataset.index = gastoIndex;

  div.innerHTML = `
    <div class="dynamic-gasto-title">Gasto ${gastoIndex}</div>
    <label>Base (€)</label>
    <input type="number" class="gasto-base" placeholder="0,00">

    <label>IVA (%)</label>
    <input type="number" class="gasto-iva" placeholder="21">
  `;

  document.getElementById("gastosContainer").appendChild(div);
}

document.getElementById("addGastoBtn").onclick = addGasto;
addGasto(); // añade uno por defecto

// Cálculo principal
function calcular() {
  const base = toNumber(baseTrabajo.value);
  const iva = toNumber(ivaTrabajo.value);
  const irpf = toNumber(irpfTrabajo.value);

  const ivaImporte = base * (iva / 100);
  const irpfImporte = base * (irpf / 100);

  const ingresos = base + ivaImporte - irpfImporte;

  // Calcular todos los gastos dinámicos
  let gastosTotales = 0;
  document.querySelectorAll(".dynamic-gasto").forEach(g => {
    const baseG = toNumber(g.querySelector(".gasto-base").value);
    const ivaG = toNumber(g.querySelector(".gasto-iva").value);
    gastosTotales += baseG + baseG * (ivaG / 100);
  });

  const beneficio = ingresos - gastosTotales;

  // Actualizar pantalla
  screenMain.textContent = euro(beneficio);
  screenSub.textContent =
    "Ingresos factura: " + euro(ingresos) +
    "\nGastos totales: " + euro(gastosTotales);

  resIngresos.textContent = euro(ingresos);
  resGastosTotales.textContent = euro(gastosTotales);
  resBeneficio.textContent = euro(beneficio);
}

btnCalcular.onclick = calcular;

// Borrar todo
btnLimpiar.onclick = () => {
  baseTrabajo.value = "";
  ivaTrabajo.value = "";
  irpfTrabajo.value = "";

  document.getElementById("gastosContainer").innerHTML = "";
  gastoIndex = 0;
  addGasto();

  screenMain.textContent = "0,00 €";
  screenSub.textContent = "Completa los campos para calcular tu beneficio.";
  resIngresos.textContent = "0,00 €";
  resGastosTotales.textContent = "0,00 €";
  resBeneficio.textContent = "0,00 €";
};
</script>

</body>
</html>
